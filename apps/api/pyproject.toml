[project]
name = "fruit-growth-agent-api"
version = "0.1.0"
description = "Multi-tenant foundation API for the fruit growth agent."
requires-python = "==3.12.*"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi==0.139.*",
  "httpx>=0.28,<0.29",
  "pgvector>=0.4,<0.5",
  "psycopg[binary,pool]>=3.2.9,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<0.13",
  "testcontainers[postgres]>=4.10,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fruit_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
