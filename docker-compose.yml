services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fruit_agent}
      POSTGRES_USER: ${POSTGRES_USER:-fruit_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fruit_agent}
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-fruit_agent} -d ${POSTGRES_DB:-fruit_agent}
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
